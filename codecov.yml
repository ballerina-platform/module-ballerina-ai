fixes:
  - "io/ballerina/stdlib/ai/plugin::.compiler-plugin/src/main/java/io/ballerina/stdlib/ai/plugin"
  - "ballerina/ai/**/::../ballerina/"
  # Since Ballerina 2201.14, the module coverage report places object methods, lambdas and module-level
  # variable initializers under synthetic packages (e.g. `ballerina/values`). Map them back to the sources.
  - "ballerina/values/::ballerina/"
  - "ballerina/lambdas/::ballerina/"
  - "ballerina/global_vars/::ballerina/"
  - "ballerina/constants/::ballerina/"
  - "ballerina/typedescs/::ballerina/"

ignore:
  - "ballerina-tests"
  - "native/src/test"
  - "ballerina/modules/intelligence" # Generated connector
  - "ballerina/modules/observe" # Needs manual testing with observablity provider

coverage:
  precision: 2
  round: down
  range: "60...80"
  status:
    project:
      default:
        target: 80
